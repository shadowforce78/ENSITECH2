<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Protection Check</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="card">
      <h1>Password Protection Check</h1>
      <input

          <img src="/img/reveal.png" alt="reveal">
      </div>
      <p id="passwordStrength"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
